<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Тэтгэлэг — гадаадад суралцах тэтгэлгийн мэдээллийн систем" />
    <meta name="google" content="notranslate" />
    <link rel="icon" href="./img/icon/logo.svg" type="image/svg+xml" />
    <!-- Миний: загварын Poppins фонт кирилл үсэггүй тул түүнтэй төстэй, кирилл дэмждэг Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" />
    <!-- Миний: хадгалсан цайвар/харанхуй горимыг CSS-ээс өмнө тавьж, ачаалах үед анивчихаас сэргийлнэ (fn/theme.js) -->
    <script>
      try {
        const theme = localStorage.getItem("tetgeleg_theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="stylesheet" href="./css/main.css" />
    <script defer src="./js/fontawesomeall.min.js"></script>
    <title>Тэтгэлэг</title>
  </head>
  <body>
    <!-- SPA: зөвхөн энэ нэг HTML ачаалагдана. Navbar, хуудсын агуулгыг JavaScript зурна. -->
    <div id="navbar"></div>
    <main>
      <div id="app"></div>
    </main>
    <!-- Бүх хуудсанд харагдах доод хэсэг. 6-р ажлаас (2.13) components/footer.js зурна. -->
    <footer class="app-footer" id="footer"></footer>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
